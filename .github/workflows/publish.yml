# Publishes the CLI (with the dashboard bundled in) to npm.
# Run it from the Actions tab (Run workflow), or push a version tag such as v1.2.0.
# One-time setup: create an npm automation token and add it as the repository secret NPM_TOKEN.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: NPM_TOKEN is set
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the NPM_TOKEN repository secret (Settings > Secrets and variables > Actions), then run this again."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
      - working-directory: packages/cli
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
