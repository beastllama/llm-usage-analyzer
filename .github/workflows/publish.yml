# Publishes the CLI (with the dashboard bundled in) to npm when you push a version tag, e.g. v1.2.0.
# One-time setup: create an npm automation token and add it as the repository secret NPM_TOKEN.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
      - working-directory: packages/cli
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Tag must match the package version
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
