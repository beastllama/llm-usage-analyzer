name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cli:
    name: CLI (typecheck, test, build) on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/npm-shrinkwrap.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (build the tarball the way a release does)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Pack the CLI
        working-directory: packages/cli
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Check what is inside the tarball
        run: |
          tgz=$(ls "$RUNNER_TEMP"/pack/llm-usage-analyzer-*.tgz)
          tar -tzf "$tgz" > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          unexpected=$(grep -v -E '^package/(dist/|web/|README\.md$|LICENSE$|package\.json$|npm-shrinkwrap\.json$)' "$RUNNER_TEMP/files.txt" || true)
          if [ -n "$unexpected" ]; then
            echo "These files should not be in the package:"
            echo "$unexpected"
            exit 1
          fi
          for f in dist/index.js web/index.html web/THIRD_PARTY_NOTICES.txt README.md LICENSE package.json npm-shrinkwrap.json; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "Missing from the package: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 3

  smoke:
    name: Install the tarball and run it on Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/pack
      - name: Install it and call it like a user would
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/llm-usage-analyzer-*.tgz
          bin=./node_modules/.bin/llm-usage-analyzer
          expected=$(node -p "require('./node_modules/llm-usage-analyzer/package.json').version")
          test "$($bin --version)" = "$expected"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/none" LLM_USAGE_HOME="$RUNNER_TEMP/home" $bin --no-open --port 3555 &
          curl -sf --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3555/ | grep -q 'llm-usage-server'
          curl -sf http://localhost:3555/THIRD_PARTY_NOTICES.txt | grep -q 'react@'
          curl -sI http://localhost:3555/ | grep -qi "content-security-policy: .*connect-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3555/api/usage)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:3555/api/usage)" = "403"
