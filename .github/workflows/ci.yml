name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cli:
    name: CLI (typecheck, test, build) on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (build the tarball the way a release does)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Pack the CLI
        working-directory: packages/cli
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Check what is inside the tarball
        run: |
          tgz=$(ls "$RUNNER_TEMP"/pack/llm-usage-analyzer-*.tgz)
          tar -tzf "$tgz" > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          unexpected=$(grep -v -E '^package/(dist/|web/|README\.md$|LICENSE$|package\.json$|npm-shrinkwrap\.json$)' "$RUNNER_TEMP/files.txt" || true)
          if [ -n "$unexpected" ]; then
            echo "These files should not be in the package:"
            echo "$unexpected"
            exit 1
          fi
          for f in dist/index.js web/index.html web/THIRD_PARTY_NOTICES.txt README.md LICENSE package.json npm-shrinkwrap.json; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "Missing from the package: $f"; exit 1; }
          done
          # The pinned list must hold what the command needs to run, and no build tools
          tar -xzOf "$tgz" package/npm-shrinkwrap.json | node -e "
            const lock = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const names = Object.keys(lock.packages).filter(Boolean);
            const dev = names.filter((name) => lock.packages[name].dev);
            if (dev.length) { console.error('Build tools are in the pinned list: ' + dev.join(', ')); process.exit(1); }
            console.log(names.length + ' runtime packages are pinned');
          "
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 3

  smoke:
    name: Install the tarball and run it (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    # Windows and macOS are checked too, but a failure there only reports: nobody has run this tool on them by hand yet
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: ${{ runner.temp }}/pack
      - name: Install it and call it like a user would
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/llm-usage-analyzer-*.tgz
          bin=./node_modules/.bin/llm-usage-analyzer
          expected=$(node -p "require('./node_modules/llm-usage-analyzer/package.json').version")
          test "$($bin --version)" = "$expected"
          # The status line must answer quickly, and always with one line
          test "$(echo '{"rate_limits":{"five_hour":{"used_percentage":12}}}' | $bin statusline)" = "5h 12% · 7d —"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/none" LLM_USAGE_HOME="$RUNNER_TEMP/home" $bin --no-open --port 3555 &
          curl -sf --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3555/ | grep -q 'llm-usage-server'
          curl -sf http://localhost:3555/THIRD_PARTY_NOTICES.txt | grep -q 'react@'
          curl -sI http://localhost:3555/ | grep -qi "content-security-policy: .*connect-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3555/api/usage)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:3555/api/usage)" = "403"
